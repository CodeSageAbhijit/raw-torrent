services:
  backend:
    build:
      context: ./rawtorrent_backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes:
      # Persist torrent pieces and session files on host storage.
      # Override RAWTORRENT_DOWNLOADS_DIR in a local .env file to use any host path.
      - type: bind
        source: ${RAWTORRENT_DOWNLOADS_DIR:-./downloads}
        target: /app/downloads
    environment:
      - PORT=4000
      - NODE_ENV=production
      - TORRENT_STORAGE_DIR=/app/downloads
      # Keep persisted sessions resumable across container restarts.
      - AUTO_RESUME_ON_BOOT=true
      # Avoid native uTP transport instability in containerized Linux runtimes.
      - WEBTORRENT_UTP=false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Route browser HTTP calls through frontend API proxy for consistent networking.
        NEXT_PUBLIC_BACKEND_HTTP_URL: /api
        NEXT_PUBLIC_BACKEND_WS_URL: ws://localhost:4000
    ports:
      - "3000:3000"
    environment:
      # Server-side (SSR) requests use the Docker internal network name
      - BACKEND_URL=http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
